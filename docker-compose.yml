services:
  redink:
    image: histonemax/redink:latest
    container_name: redink
    expose:
      - "12398"
    volumes:
      # 持久化输出目录
      - ./output:/app/output
      # 可选：挂载自定义配置文件
      # - ./text_providers.yaml:/app/text_providers.yaml
      # - ./image_providers.yaml:/app/image_providers.yaml
    restart: unless-stopped
    networks:
      - redink-network

  nginx:
    image: nginx:alpine
    container_name: redink-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/var/www/certbot:ro
    depends_on:
      - redink
    restart: unless-stopped
    networks:
      - redink-network

  certbot:
    image: certbot/certbot
    container_name: redink-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/html:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

networks:
  redink-network:
    driver: bridge
